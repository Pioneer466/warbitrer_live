services:
  - type: web
    name: warbitrer-live-preview
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: warbitrer-live-db
          property: connectionString
      - key: APP_BASIC_AUTH_USER
        sync: false
      - key: APP_BASIC_AUTH_PASSWORD
        sync: false
      - key: KALSHI_API_KEY_ID
        sync: false
      - key: KALSHI_PRIVATE_KEY_PEM
        sync: false
      - key: KALSHI_ENV
        value: demo
      - key: POLY_PRIVATE_KEY
        sync: false
      - key: POLY_API_KEY
        sync: false
      - key: POLY_API_SECRET
        sync: false
      - key: POLY_API_PASSPHRASE
        sync: false
      - key: POLY_FUNDER_ADDRESS
        sync: false
      - key: POLY_SIGNATURE_TYPE
        value: POLY_PROXY
      - key: POLY_AUTO_REDEEM
        value: "false"
      - key: POLY_BRIDGE_LOW_WATER_USDC
        value: "250"
      - key: POLYGON_RPC_URL
        value: https://polygon-rpc.com

databases:
  - name: warbitrer-live-db
    plan: free
    databaseName: warbitrer_live
    user: warbitrer
